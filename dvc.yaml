stages:

  data_ingestion:
    cmd: python src/data_ingestion.py
    deps:
      - src/data_ingestion.py
      - experiments/application_train.csv
    outs:
      - data/raw/train.csv
      - data/raw/test.csv

  feature_engineering:
    cmd: python src/feature_engineering.py
    deps:
      - src/feature_engineering.py
      - src/config/features.py
      - data/raw/train.csv
      - data/raw/test.csv
    outs:
      - data/selected/train.csv
      - data/selected/test.csv

  data_preprocessing:
    cmd: python src/data_preprocessing.py
    deps:
      - src/data_preprocessing.py
      - src/config/features.py
      - data/selected/train.csv
      - data/selected/test.csv
    outs:
      - data/processed/X_train.pkl
      - data/processed/X_test.pkl
      - data/processed/y_train.pkl
      - data/processed/y_test.pkl
      - data/processed/preprocessor.pkl

  model_training:
    cmd: python src/model_training.py
    deps:
      - src/model_training.py
      - params.yaml
      - data/processed/X_train.pkl
      - data/processed/y_train.pkl
    params:
      - model 
      - hyperparameter_tuning
    outs:
      - data/model/best_model.pkl

  model_evaluation:
    cmd: python src/model_evaluation.py
    deps:
      - src/model_evaluation.py
      - data/model/best_model.pkl
      - data/processed/X_test.pkl
      - data/processed/y_test.pkl
    metrics:
      - data/metrics/metrics.json
    outs:
      - data/plots/roc_curve.png
      - data/plots/precision_recall_curve.png