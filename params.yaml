data_ingestion:
  test_size: 0.2
  random_state: 42

  
model:
  random_state: 42
  eval_metric: logloss
  scale_pos_weight: 11

hyperparameter_tuning:
  n_iter: 20
  cv: 3
  scoring: f1
  random_state: 42

  params:
    n_estimators: [100,200,300,500]
    max_depth: [5,7,9]
    learning_rate: [0.01,0.05,0.2]
    subsample: [0.6,0.8]
    colsample_bytree: [0.6,0.8,1.0]
    scale_pos_weight: [1,3,5,11]
    gamma: [0,0.1,0.3,0.5]


